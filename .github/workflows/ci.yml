name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: Rust (build node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-12-14
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Build (release)
        run: cargo build --release --package myl1-node-cli

  web:
    name: Web (explorer + wallet build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            explorer/package-lock.json
            wallet/package-lock.json

      - name: Explorer (install + build)
        working-directory: explorer
        run: |
          npm ci
          npm run build

      - name: Wallet (install + build)
        working-directory: wallet
        run: |
          npm ci
          npm run build


