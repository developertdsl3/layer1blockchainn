version: "3.8"

services:
  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  # Subsquid-style indexer
  squid-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=myl1_squid
    ports:
      - "5432:5432"
    volumes:
      - squid-db:/var/lib/postgresql/data

  squid-processor:
    image: node:20
    working_dir: /app
    volumes:
      - ../subsquid:/app
    depends_on:
      - squid-db
    environment:
      - DATABASE_URL=postgres://postgres:postgres@squid-db:5432/myl1_squid
      - WS_ENDPOINT=${WS_ENDPOINT:-ws://host.docker.internal:9944}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -lc "npm install && node src/processor.js"

  squid-graphql:
    image: node:20
    working_dir: /app
    volumes:
      - ../subsquid:/app
    depends_on:
      - squid-db
    environment:
      - DATABASE_URL=postgres://postgres:postgres@squid-db:5432/myl1_squid
      - PORT=4350
    ports:
      - "4350:4350"
    command: bash -lc "npm install && node src/server.js"

  # Explorer + Wallet (dev mode)
  explorer:
    image: node:20
    working_dir: /app
    volumes:
      - ../../explorer:/app
    ports:
      - "3000:3000"
    command: bash -lc "npm install && npm start"

  wallet:
    image: node:20
    working_dir: /app
    volumes:
      - ../../wallet:/app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    command: bash -lc "npm install && npm start"

volumes:
  prometheus-data:
  grafana-data:
  squid-db:


