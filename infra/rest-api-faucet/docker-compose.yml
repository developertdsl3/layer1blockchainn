version: '3.8'

services:
  rest-api:
    build:
      context: ../rest-api
      dockerfile: Dockerfile
    container_name: myl1-rest-api
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - WS_ENDPOINT=${WS_ENDPOINT:-ws://host.docker.internal:9944}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - myl1-network

  faucet:
    build:
      context: ../faucet
      dockerfile: Dockerfile
    container_name: myl1-faucet
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - WS_ENDPOINT=${WS_ENDPOINT:-ws://host.docker.internal:9944}
      - FAUCET_MNEMONIC=${FAUCET_MNEMONIC:-}
      - FAUCET_AMOUNT=${FAUCET_AMOUNT:-1000000000000000000}
      - FAUCET_COOLDOWN=${FAUCET_COOLDOWN:-3600000}
      - FAUCET_MAX_BALANCE=${FAUCET_MAX_BALANCE:-10000000000000000000000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - myl1-network
    depends_on:
      - rest-api

networks:
  myl1-network:
    driver: bridge

