<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyL1 Faucet - Testnet Token Distribution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status.available {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.unavailable {
            background: #ffebee;
            color: #c62828;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .info ul {
            list-style: none;
            padding-left: 0;
        }

        .info li {
            margin-bottom: 5px;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .faucet-address {
            background: #f0f4ff;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚰 MyL1 Faucet</h1>
            <p>Get testnet tokens for development</p>
        </div>

        <div id="status" class="status">
            <div class="loading"></div> Checking status...
        </div>

        <form id="faucetForm">
            <div class="form-group">
                <label for="address">Your Address</label>
                <input 
                    type="text" 
                    id="address" 
                    name="address" 
                    placeholder="5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
                    required
                />
            </div>

            <button type="submit" id="submitBtn" disabled>
                Request Tokens
            </button>
        </form>

        <div id="message"></div>

        <div class="info">
            <h3>ℹ️ Information</h3>
            <ul>
                <li><strong>Amount:</strong> <span id="amount">1</span> MYL1 per request</li>
                <li><strong>Cooldown:</strong> <span id="cooldown">60</span> minutes</li>
                <li><strong>Network:</strong> MyL1 Testnet</li>
            </ul>
            <div class="faucet-address" id="faucetAddress" style="display: none;">
                <strong>Faucet Address:</strong><br>
                <span id="faucetAddr"></span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('faucetForm');
        const statusDiv = document.getElementById('status');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const addressInput = document.getElementById('address');

        // Check status on load
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.available) {
                    statusDiv.className = 'status available';
                    statusDiv.innerHTML = `✅ Faucet Available<br><small>Balance: ${data.formattedBalance} MYL1</small>`;
                    submitBtn.disabled = false;
                    document.getElementById('amount').textContent = data.formattedAmount;
                    document.getElementById('cooldown').textContent = data.cooldown;
                    document.getElementById('faucetAddr').textContent = data.address;
                    document.getElementById('faucetAddress').style.display = 'block';
                } else {
                    statusDiv.className = 'status unavailable';
                    statusDiv.innerHTML = `❌ Faucet Unavailable<br><small>${data.reason || 'Insufficient balance'}</small>`;
                    submitBtn.disabled = true;
                }
            } catch (error) {
                statusDiv.className = 'status unavailable';
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                submitBtn.disabled = true;
            }
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const address = addressInput.value.trim();
            if (!address) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Processing...';
            messageDiv.innerHTML = '';

            try {
                const response = await fetch('/api/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ address }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDiv.className = 'success';
                    messageDiv.innerHTML = `
                        ✅ Tokens sent successfully!<br>
                        <small>Transaction: ${data.txHash}</small><br>
                        <small>Amount: ${data.formattedAmount} MYL1</small>
                    `;
                    addressInput.value = '';
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = `❌ ${data.error || 'Request failed'}`;
                    if (data.remainingMinutes) {
                        messageDiv.innerHTML += `<br><small>Try again in ${data.remainingMinutes} minutes</small>`;
                    }
                }
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.innerHTML = `❌ Error: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Request Tokens';
                checkStatus(); // Refresh status
            }
        });

        // Initial status check
        checkStatus();
        setInterval(checkStatus, 30000); // Check every 30 seconds
    </script>
</body>
</html>
