[settings]
enable_tracing = false

[relaychain]
# Run a standalone Substrate chain (MyL1) under Zombienet using the native provider.
# You must have `myl1-node` built and available in PATH or provide an absolute path via Zombienet CLI flags.
default_command = "myl1-node"
chain = "local"

# Prefer using the raw chainspec generated by:
#   ./target/release/myl1-node build-spec --chain local --raw > config/chain-specs/local-raw.json
chain_spec_path = "../config/chain-specs/local-raw.json"

  [[relaychain.nodes]]
  name = "validator-1"
  validator = true

  [[relaychain.nodes]]
  name = "validator-2"
  validator = true

  [[relaychain.nodes]]
  name = "validator-3"
  validator = true

  [[relaychain.nodes]]
  name = "validator-4"
  validator = true

  [[relaychain.nodes]]
  name = "validator-5"
  validator = true


